<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HK.yesletter · 香港研究生专业对比</title>
  <meta name="description" content="把港八大的硕士项目放在一张桌上，逐项对比申请要求、课程、学费与就业方向。" />
  <meta property="og:title" content="HK.yesletter · 香港研究生专业对比" />
  <meta property="og:description" content="把港八大的硕士项目放在一张桌上，逐项对比申请要求、课程、学费与就业方向。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://hk.yesletter.org/" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-brand" href="./">HK.yesletter</a>
      <div class="nav-actions">
        <button id="btn-share" class="nav-btn">分享</button>
        <button id="btn-print" class="nav-btn">导出</button>
      </div>
    </div>
  </nav>

  <section class="hero">
    <h1 class="hero-title">
      在香港，<br/>找到属于你的<br/><span class="accent">那一个</span>硕士项目。
    </h1>
    <p class="hero-sub">把港八大的硕士项目放在一张桌上，逐项比较。</p>
    <a class="hero-cta" href="#tool">开始对比 ↓</a>
  </section>

  <section class="tool" id="tool">
    <div class="tool-inner">
      <div class="filter-block">
        <div class="filter-label">学校</div>
        <div id="school-pills" class="pill-group"></div>
      </div>

      <div class="filter-block">
        <div class="filter-label">方向</div>
        <div id="direction-pills" class="pill-group"></div>
      </div>

      <div class="filter-block">
        <div class="filter-switch-row">
          <div>
            <div class="filter-label inline">纳入相关专业</div>
            <div class="filter-hint">把相关领域（金融科技、金融工程、商业分析等）也加入对比</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="include-related" />
            <span class="switch-slider"></span>
          </label>
        </div>
      </div>

      <div class="filter-actions">
        <button id="btn-reset" class="text-btn">清空筛选</button>
      </div>
    </div>
  </section>

  <section class="results">
    <div class="results-inner">
      <div id="results-summary" class="results-summary"></div>
      <div id="results-table" class="results-table"></div>
      <div id="results-empty" class="results-empty">
        <p>选择学校与方向，开始对比。</p>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <p>所有数据为产品原型示例，最终决策请以各校招生官网为准。</p>
      <p>本站编辑观点不代表各校立场。本站观点，仅供参考。</p>
      <p class="footer-copy">HK.yesletter · 原型版本</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
